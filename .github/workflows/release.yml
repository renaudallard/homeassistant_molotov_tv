name: Release on version bump

on:
  push:
    branches:
      - main
    paths:
      - 'custom_components/molotov_tv/manifest.json'

permissions:
  contents: write

jobs:
  # There is no test suite here, so hassfest is the check that says the
  # integration still loads. The release waits for it.
  verify:
    uses: ./.github/workflows/hassfest.yml

  release:
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The bump can sit in any commit of the push, so the old manifest
          # has to be reachable however far back the push starts.
          fetch-depth: 0

      - name: Check for version change
        id: version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          manifest=custom_components/molotov_tv/manifest.json
          new=$(jq -r .version "$manifest")
          # Compare against where the branch stood before the push rather than
          # against the parent of the tip. A push whose bump is not the last
          # commit looks unchanged from HEAD~1 and never gets released.
          base="$BEFORE"
          case "$base" in
            ""|0000000000000000000000000000000000000000) base="HEAD^" ;;
          esac
          git rev-parse --verify --quiet "$base^{commit}" >/dev/null || base="HEAD^"
          old=$(git show "$base:$manifest" 2>/dev/null | jq -r .version 2>/dev/null || echo "")
          if [ "$old" = "null" ]; then
            old=""
          fi
          echo "comparing against $base"
          echo "old=$old"
          echo "new=$new"
          if [ "$new" != "$old" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "tag=v$new" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.version.outputs.changed == 'true'
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create zip archive
        if: steps.version.outputs.changed == 'true'
        run: |
          cd custom_components/molotov_tv
          zip -r ../../molotov_tv.zip .

      - name: Create Release
        if: steps.version.outputs.changed == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: molotov_tv.zip
          generate_release_notes: true
